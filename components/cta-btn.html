<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Call-to-action</title>
        <link rel="stylesheet" href="basic.css">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Forum&display=swap"
        rel="stylesheet"
    />
        <style>
            .cta-btn {
            background: var(--clr-primary);
            color: var(--clr-white);
            font-family: var(--ff-label);
            font-size: 1.4rem;
            padding: 16px 40px;
            border: 2px solid var(--clr-primary);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            box-shadow: var(--shadow-soft);
            transition: all 0.2s;
            }
            .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 216, 150, 0.5);
            }
        </style>
    </head>
    <body>
        <button onclick="funcPlaceholder()" class="cta-btn">Do something</button>

    <script>
        function funcPlaceholder() {
            // here you must place cta's function
        }
    </script>
    </body>
</html>
