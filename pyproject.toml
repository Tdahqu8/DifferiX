[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "differix"
version = "0.1.0-alpha.1"
description = "The Deterministic, Local-First OS for Autonomous AI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tdahqu8" }
]
keywords = ["ai", "llm", "agents", "multi-agent", "openai", "claude", "autonomous", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "GitPython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
full = [
    "fastembed>=0.3.0", 
    "PyYAML>=6.0",
    "playwright>=1.40.0"
]

[project.urls]
"Homepage" = "https://differix.dev"
"Bug Tracker" = "https://github.com/Tdahqu8/DifferiX/issues"
"Source Code" = "https://github.com/Tdahqu8/DifferiX"

[project.scripts]
differix = "main:run_cli"

# --- Explicit package discovery (fixes flat-layout auto-discovery error) ---
[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = [
    "memory*",
    "tools*",
    "agents*",
    "cli*",
    "commands*",
]
exclude = [
    "lessons*",
    "skills*",
    "status*",
    "iteration_logs*",
    ".vegex*",
    "tests*",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast, no I/O, no network",
    "integration: touches filesystem, uses tmp_path",
    "llm: actually calls an LLM (expensive, skipped by default)",
    "slow: takes more than 5 seconds",
]